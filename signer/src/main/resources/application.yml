spring:
  application:
    name: cryptobot-signer
  main:
    web-application-type: reactive
  reactor:
    # el Reactor Context se proyecta al MDC alrededor de cada operador (LogContext).
    context-propagation: auto

server:
  port: ${SIGNER_PORT:8096}
  error:
    include-message: never
    include-stacktrace: never

signer:
  # 64-byte solana-keygen id.json. Mount it read-only; never commit it; never put it in a DB.
  keypair-path: ${SIGNER_KEYPAIR_PATH:}
  # Alternative for containers without a mount: the same JSON array as a string.
  keypair-json: ${SIGNER_KEYPAIR_JSON:}
  # Shared service token cryptobot-service must present in X-Signer-Token. NOT a key.
  token: ${SIGNER_TOKEN:}
  cluster: ${SIGNER_CLUSTER:devnet}
  # Hard caps: enforced here, independently of anything cryptobot-service decided.
  max-lamports: ${SIGNER_MAX_LAMPORTS:2000000000}
  allowed-destinations: ${SIGNER_ALLOWED_DESTINATIONS:}
  # Emergency stop for the signer itself.
  enabled: ${SIGNER_ENABLED:true}
  # (paper §20, level 5): base58 public key of cryptobot-validator. A sign request must carry
  # an attestation signed by it for this proposal and these exact bytes, not a DENY, not expired.
  # Empty while require-attestation is true ⇒ every request is refused (fail-closed).
  validator-public-key: ${SIGNER_VALIDATOR_PUBLIC_KEY:}
  # false = legacy behaviour (token + byte-level limits only). Tests and empty demo wallets only.
  # false is only accepted with SPRING_PROFILES_ACTIVE=local (or test); any other profile
  # refuses to start.
  require-attestation: ${SIGNER_REQUIRE_ATTESTATION:true}
  # mainnet is fail-closed. A sign request whose cluster is mainnet-beta is refused
  # (403 mainnet_disabled) unless this is true — independently of cryptobot-service's flag.
  allow-mainnet: ${SIGNER_ALLOW_MAINNET:false}

lifeengine:
  # Entorno para la identidad del build (logs `env`, common tag `environment`). De APP_ENV, nunca hardcodeado.
  deployment:
    env: ${APP_ENV:local}
  # `json` (default, lo que lee Promtail/Loki) o `text` (una consola con un humano).
  logging:
    format: ${LOG_FORMAT:json}

# identidad del build cuando la imagen no tiene .git (build-args de CI). Nunca un secreto.
identity:
  git:
    commit: ${GIT_COMMIT:}
    branch: ${GIT_BRANCH:}
    commit-time: ${GIT_COMMIT_TIME:}

management:
  endpoints:
    web:
      exposure:
        # prometheus: sólo desde la red interna; el compose/k8s no lo publica.
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  # tracer siempre activo (traceId/spanId en cada línea; acepta el traceparent del servicio).
  # Exportar es por entorno: MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED=true + OTEL_EXPORTER_OTLP_ENDPOINT.
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:false}

logging:
  level:
    root: INFO
