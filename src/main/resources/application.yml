spring:
  application:
    name: cryptobot-service
  main:
    web-application-type: reactive

  # R2DBC is the runtime data plane (used by application services & controllers).
  r2dbc:
    url: ${CRYPTOBOT_R2DBC_URL:r2dbc:postgresql://localhost:5433/life_engine_cryptobot}
    username: ${CRYPTOBOT_DB_USER:life_engine}
    password: ${CRYPTOBOT_DB_PASSWORD:life_engine}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      max-idle-time: 5m

  # Flyway runs at startup via JDBC against the same database.
  flyway:
    enabled: true
    url: ${CRYPTOBOT_JDBC_URL:jdbc:postgresql://localhost:5433/life_engine_cryptobot}
    user: ${CRYPTOBOT_DB_USER:life_engine}
    password: ${CRYPTOBOT_DB_PASSWORD:life_engine}
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${CRYPTOBOT_SERVICE_PORT:8091}
  error:
    include-message: never
    include-stacktrace: never

cryptobot:
  runtime:
    base-url: ${CRYPTOBOT_RUNTIME_BASE_URL:http://localhost:8090}
    workflow-id: crypto.market-review.v1
  snapshot:
    # deterministic-local (default, offline) · binance-public (api.binance.com ticker 24h) ·
    # solana-public (GeckoTerminal pool + Jupiter price; keyless). All read-only.
    provider: ${CRYPTOBOT_SNAPSHOT_PROVIDER:deterministic-local}
  security:
    enabled: ${CRYPTOBOT_SECURITY_ENABLED:true}
  binance:
    base-url: ${CRYPTOBOT_BINANCE_BASE_URL:https://api.binance.com}
    timeout: ${CRYPTOBOT_BINANCE_TIMEOUT:3s}
  monitoring:
    # Disabled by default — manual triggers via POST /api/cryptobot/monitoring/run-once
    # are always available. Set CRYPTOBOT_MONITORING_ENABLED=true to enable the periodic
    # background loop (requires a service-side bearer token; see MonitoringService).
    enabled: ${CRYPTOBOT_MONITORING_ENABLED:false}
    symbols: ${CRYPTOBOT_MONITORING_SYMBOLS:BTCUSDT,SOLUSDT}
    interval: ${CRYPTOBOT_MONITORING_INTERVAL:10m}
    workflow-id: ${CRYPTOBOT_MONITORING_WORKFLOW_ID:crypto.market-review.v1}

  # ---- Colosseum control plane (wallet → portfolio → risk → advisor → proposal → approval) ----
  solana:
    # Market data for the market-review pipeline (symbol → DEX pool). Binance stays; Solana is added.
    market:
      gecko-terminal-base-url: ${CRYPTOBOT_GECKOTERMINAL_BASE_URL:https://api.geckoterminal.com}
      jupiter-base-url: ${CRYPTOBOT_JUPITER_BASE_URL:https://lite-api.jup.ag}
      timeout: 6s
      pools:
        SOLUSDC: 58oQChx4yWmvKdwLLZzBi4ChoCc2fqCUWBkwMihLYQo2   # Raydium SOL/USDC
      mints: {}
    rpc:
      devnet-url: ${CRYPTOBOT_SOLANA_DEVNET_RPC:https://api.devnet.solana.com}
      mainnet-url: ${CRYPTOBOT_SOLANA_MAINNET_RPC:https://api.mainnet-beta.solana.com}
      timeout: ${CRYPTOBOT_SOLANA_RPC_TIMEOUT:8s}
  marketdata:
    jupiter-enabled: ${CRYPTOBOT_JUPITER_ENABLED:true}
    jupiter-base-url: ${CRYPTOBOT_JUPITER_BASE_URL:https://lite-api.jup.ag}
    timeout: 6s
    # Stale-but-honest prices used only when Jupiter is unreachable; the snapshot says "fallback-static".
    fallback-prices:
      SOL: 100
      USDC: 1
      USDT: 1
      JUP: 0.5
      BONK: 0.00002
      MSOL: 120
      JITOSOL: 118
    # devnet mint → mainnet mint it is valued as. Circle devnet USDC is built in; add your own here.
    aliases: {}
  # ---- ARS quotes across Argentine exchanges (KAN-355): GET /api/cryptobot/quotes/{asset} ----
  # Public, keyless, read-only price feeds only. One board per exchange, cached cache-ttl (30–60 s by
  # design); a failed refresh serves the previous board flagged stale while younger than stale-max.
  quotes:
    cache-ttl: ${CRYPTOBOT_QUOTES_CACHE_TTL:45s}
    stale-max: ${CRYPTOBOT_QUOTES_STALE_MAX:5m}
    timeout: ${CRYPTOBOT_QUOTES_TIMEOUT:5s}
    exchanges:
      bitso:
        enabled: ${CRYPTOBOT_QUOTES_BITSO_ENABLED:true}
        base-url: ${CRYPTOBOT_QUOTES_BITSO_BASE_URL:https://api.bitso.com}
      ripio:
        enabled: ${CRYPTOBOT_QUOTES_RIPIO_ENABLED:true}
        base-url: ${CRYPTOBOT_QUOTES_RIPIO_BASE_URL:https://app.ripio.com}
      buenbit:
        enabled: ${CRYPTOBOT_QUOTES_BUENBIT_ENABLED:true}
        base-url: ${CRYPTOBOT_QUOTES_BUENBIT_BASE_URL:https://be.buenbit.com}
    # Withdrawal fees in units of the asset, by exchange → asset → network. None of the three feeds
    # publishes fees on a public endpoint, so this table is maintained by hand from each exchange's
    # fee page and is reported as source=CONFIGURED (never as live). Empty by default on purpose:
    # an unknown fee is shown as "not applied", a made-up one would rank exchanges wrongly.
    # Example:
    #   ripio:
    #     USDT:
    #       TRON: 1
    withdrawal-fees: {}
  risk:
    concentration-high-pct: ${CRYPTOBOT_RISK_CONCENTRATION_HIGH:60}
    concentration-medium-pct: ${CRYPTOBOT_RISK_CONCENTRATION_MEDIUM:40}
    min-stable-pct: ${CRYPTOBOT_RISK_MIN_STABLE:10}
    dust-usd: 1
    sharp-move-pct: 5
  policy:
    # Emergency stop. false ⇒ nothing is ever signed or broadcast; proposals still work as paper trades.
    execution-enabled: ${CRYPTOBOT_EXECUTION_ENABLED:true}
    execution-cluster: devnet
    max-trade-usd: ${CRYPTOBOT_POLICY_MAX_TRADE_USD:500}
    max-trade-pct-of-portfolio: ${CRYPTOBOT_POLICY_MAX_TRADE_PCT:50}
    allowed-assets: SOL,USDC,USDT
    cooldown: ${CRYPTOBOT_POLICY_COOLDOWN:60s}
    # Destination of the executable SOL leg on devnet. Empty ⇒ proposals are approvable but not executable.
    rebalance-vault: ${CRYPTOBOT_REBALANCE_VAULT:}
    max-lamports-per-tx: ${CRYPTOBOT_POLICY_MAX_LAMPORTS:2000000000}
    proposal-ttl: 30m
  signer:
    enabled: ${CRYPTOBOT_SIGNER_ENABLED:false}
    base-url: ${CRYPTOBOT_SIGNER_BASE_URL:http://localhost:8096}
    # Shared service token (NOT a key). Must match SIGNER_TOKEN of cryptobot-signer.
    token: ${CRYPTOBOT_SIGNER_TOKEN:}
    timeout: 8s
  # ---- Business metrics (KAN-425): /actuator/prometheus, names in observability/CryptobotMetrics ----
  metrics:
    # Extra values allowed in the `asset` label, on top of policy.allowed-assets and monitoring.symbols.
    # Any other symbol is reported as `other` so a caller cannot create series (cardinality is bounded).
    assets: ${CRYPTOBOT_METRICS_ASSETS:}
  advisor:
    workflow-id: ${CRYPTOBOT_ADVISOR_WORKFLOW_ID:crypto.portfolio-advisor.v1}
    timeout: ${CRYPTOBOT_ADVISOR_TIMEOUT:90s}
    poll-interval: 1500ms
    locale: ${CRYPTOBOT_ADVISOR_LOCALE:en}

lifeengine:
  # Deployment environment for build identity (/actuator/info) and metric common tags. From APP_ENV —
  # never hardcoded per environment (KAN-199 / §2.2).
  deployment:
    env: ${APP_ENV:local}
  security:
    jwt:
      secret: ${JWT_SECRET:}
    jwks:
      uri: ${AUTH_JWKS_URI:}
  cryptobot:
    security:
      # Phase-1 bridge: while life-engine-auth has not yet seeded RUNTIME_VIEWER /
      # RUNTIME_OPERATOR / RUNTIME_ADMIN permissions (auth db/migration/V49__auth_rbac.sql),
      # mint them locally from the JWT `role` claim and ROLE_ADMIN so the runtime can call
      # /api/cryptobot/** with a forwarded user token. Set to `false` once auth ships
      # proper RUNTIME_* permission rows + role mappings.
      derive-runtime-authorities-from-role: ${CRYPTOBOT_DERIVE_RUNTIME_AUTHORITIES:true}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  # BuildIdentityConfig owns /actuator/info in the exact shape of LIFE-OPS-02 §2.2. The stock env/git/build
  # contributors are disabled so they cannot pollute or reshape that contract (KAN-199).
  info:
    env:
      enabled: false
    git:
      enabled: false
    build:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Build identity overrides. Empty by default: local and CI builds carry a .git directory, so git.properties
# (git-commit-id) is the source. A future Docker image (KAN-109) with no .git would pass these as
# build-args → env, and BuildIdentityResolver prefers them. Never a secret.
identity:
  git:
    commit: ${GIT_COMMIT:}
    branch: ${GIT_BRANCH:}
    commit-time: ${GIT_COMMIT_TIME:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p marketReviewId=%X{marketReviewId:-} runtimeRunId=%X{runtimeRunId:-} [%t] %logger{36} - %msg%n"
  level:
    root: INFO
    io.lifeengine.cryptobot: INFO
