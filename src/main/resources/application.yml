spring:
  application:
    # `cryptobot-service` y no `life-engine-cryptobot-service`: es el valor del label `service` de las
    # métricas que ya consultan los tableros de deploy/observability (service=~"cryptobot|cryptobot-service").
    name: cryptobot-service
  main:
    web-application-type: reactive
  reactor:
    # el Reactor Context se proyecta al MDC alrededor de cada operador (LogContext). Sin
    # esto, traceId/requestId/tenantId/proposalId salen vacíos en cualquier hilo que no sea el del filtro.
    context-propagation: auto

  # R2DBC is the runtime data plane (used by application services & controllers).
  r2dbc:
    url: ${CRYPTOBOT_R2DBC_URL:r2dbc:postgresql://localhost:5433/life_engine_cryptobot}
    # sin default de credencial en el archivo común: CRYPTOBOT_DB_USER / _PASSWORD llegan
    # por entorno (.env.local en local; SOPS/compose en los ambientes). application-local.yml
    # conserva el par de desarrollo, que sólo aplica con el perfil `local`.
    username: ${CRYPTOBOT_DB_USER:}
    password: ${CRYPTOBOT_DB_PASSWORD:}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
      max-idle-time: 5m

  # Flyway runs at startup via JDBC against the same database.
  flyway:
    enabled: true
    url: ${CRYPTOBOT_JDBC_URL:jdbc:postgresql://localhost:5433/life_engine_cryptobot}
    user: ${CRYPTOBOT_DB_USER:}
    password: ${CRYPTOBOT_DB_PASSWORD:}
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${CRYPTOBOT_SERVICE_PORT:8091}
  error:
    include-message: never
    include-stacktrace: never

cryptobot:
  runtime:
    base-url: ${CRYPTOBOT_RUNTIME_BASE_URL:http://localhost:8090}
    workflow-id: crypto.market-review.v1
    # con qué credencial se llama a Runtime.
    #   passthrough (default): las llamadas de un usuario viajan con SU JWT (Runtime ve identidad y
    #     tenant reales; modelo de fase 1). El loop de monitoreo, sin usuario, usa el token S2S.
    #   service: TODAS las llamadas con el token S2S (aud=runtime, sub=service:cryptobot). Exige el
    #     cliente `cryptobot` en Auth y `service:cryptobot` en el allowlist de Runtime.
    auth-mode: ${CRYPTOBOT_RUNTIME_AUTH_MODE:passthrough}
  # credencial service-to-service de CryptoBot: POST {AUTH_INTERNAL_BASE_URL}
  # /api/auth/internal/service-token (RS256, TTL corto, una audiencia por token). Sin defaults de
  # credencial; en un ambiente real el servicio no arranca si el camino S2S está activo
  # (auth-mode=service o monitoring.enabled=true) y faltan. No hay fallback a token estático ni a
  # request sin Authorization.
  s2s:
    auth-base-url: ${AUTH_INTERNAL_BASE_URL:}
    client-id: ${CRYPTOBOT_S2S_CLIENT_ID:}
    client-secret: ${CRYPTOBOT_S2S_CLIENT_SECRET:}
    refresh-margin-seconds: ${CRYPTOBOT_S2S_REFRESH_MARGIN_SECONDS:30}
    request-timeout-seconds: ${CRYPTOBOT_S2S_TIMEOUT_SECONDS:5}
  snapshot:
    # deterministic-local (default, offline) · binance-public (api.binance.com ticker 24h) ·
    # solana-public (GeckoTerminal pool + Jupiter price; keyless). All read-only.
    provider: ${CRYPTOBOT_SNAPSHOT_PROVIDER:deterministic-local}
  security:
    enabled: ${CRYPTOBOT_SECURITY_ENABLED:true}
  binance:
    base-url: ${CRYPTOBOT_BINANCE_BASE_URL:https://api.binance.com}
    timeout: ${CRYPTOBOT_BINANCE_TIMEOUT:3s}
  monitoring:
    # Disabled by default — manual triggers via POST /api/cryptobot/monitoring/run-once
    # are always available. Set CRYPTOBOT_MONITORING_ENABLED=true to enable the periodic
    # background loop (requires the S2S credential cryptobot.s2s.*; see MonitoringService).
    enabled: ${CRYPTOBOT_MONITORING_ENABLED:false}
    symbols: ${CRYPTOBOT_MONITORING_SYMBOLS:BTCUSDT,SOLUSDT}
    interval: ${CRYPTOBOT_MONITORING_INTERVAL:10m}
    workflow-id: ${CRYPTOBOT_MONITORING_WORKFLOW_ID:crypto.market-review.v1}

  # ---- Colosseum control plane (wallet → portfolio → risk → advisor → proposal → approval) ----
  solana:
    # Market data for the market-review pipeline (symbol → DEX pool). Binance stays; Solana is added.
    market:
      gecko-terminal-base-url: ${CRYPTOBOT_GECKOTERMINAL_BASE_URL:https://api.geckoterminal.com}
      jupiter-base-url: ${CRYPTOBOT_JUPITER_BASE_URL:https://lite-api.jup.ag}
      timeout: 6s
      pools:
        SOLUSDC: 58oQChx4yWmvKdwLLZzBi4ChoCc2fqCUWBkwMihLYQo2   # Raydium SOL/USDC
      mints: {}
    rpc:
      devnet-url: ${CRYPTOBOT_SOLANA_DEVNET_RPC:https://api.devnet.solana.com}
      mainnet-url: ${CRYPTOBOT_SOLANA_MAINNET_RPC:https://api.mainnet-beta.solana.com}
      timeout: ${CRYPTOBOT_SOLANA_RPC_TIMEOUT:8s}
  # ---- Price oracle (paper §22): ≥2 independent keyless sources, median, freshness, deviation
  # bound, circuit breaker. No consensus ⇒ the portfolio view falls back to the static prices below
  # (labelled "fallback-static") and the policy DENIES every proposal: CorrectRules + CorruptState ⇏ SafeExecution.
  marketdata:
    jupiter-enabled: ${CRYPTOBOT_JUPITER_ENABLED:true}
    jupiter-base-url: ${CRYPTOBOT_JUPITER_BASE_URL:https://lite-api.jup.ag}
    timeout: 6s
    pyth:
      enabled: ${CRYPTOBOT_PYTH_ENABLED:true}
      base-url: ${CRYPTOBOT_PYTH_BASE_URL:https://hermes.pyth.network}
      # symbol → Hermes price-feed id (hex). Only the policy's allowed assets are pinned here; a symbol
      # without a feed is simply not observed by Pyth (the other sources still have to reach quorum).
      feeds:
        SOL: ef0d8b6fda2ceba41da15d4095d1da392a0d2f8ed0c6c7bc0f4cfac8c280b56d
        USDC: eaa020c61cc479712813461ce153894a96a6c00b21ed0cfc2798d1f9a9e9c94a
        USDT: 2b89b9dc8fdf9f34709a5b106b472f0f39bb6ca9ce04b0fd7f2e971688e2e53b
    coingecko:
      enabled: ${CRYPTOBOT_COINGECKO_ENABLED:true}
      base-url: ${CRYPTOBOT_COINGECKO_BASE_URL:https://api.coingecko.com}
      # symbol → CoinGecko coin id. Unknown ids are ignored by the API.
      ids:
        SOL: solana
        USDC: usd-coin
        USDT: tether
        JUP: jupiter-exchange-solana
        BONK: bonk
        MSOL: msol
        JITOSOL: jito-staked-sol
        RAY: raydium
        WIF: dogwifcoin
        PYTH: pyth-network
        JTO: jito-governance-token
    # Coinbase spot, keyless, one exchange — the source that keeps the quorum when Pyth answers 401
    # (its public endpoint needs a key since 2026-09) and CoinGecko's public tier lags.
    coinbase:
      enabled: ${CRYPTOBOT_COINBASE_ENABLED:true}
      base-url: ${CRYPTOBOT_COINBASE_BASE_URL:https://api.coinbase.com}
      products:
        SOL: SOL-USD
        USDC: USDC-USD
        USDT: USDT-USD
        JUP: JUP-USD
        BONK: BONK-USD
        RAY: RAY-USD
        WIF: WIF-USD
        PYTH: PYTH-USD
        JTO: JTO-USD
    # The integrity assumptions of the execution envelope. Their hash travels in every decision.
    oracle:
      min-sources: ${CRYPTOBOT_ORACLE_MIN_SOURCES:2}          # quorum; never below 2
      max-age: ${CRYPTOBOT_ORACLE_MAX_AGE:300s}               # an observation older than this is not a fact (CoinGecko's public tier lags 1–3 min)
      max-deviation-bps: ${CRYPTOBOT_ORACLE_MAX_DEVIATION_BPS:100}   # every source within 1 % of the median
      max-move-bps: ${CRYPTOBOT_ORACLE_MAX_MOVE_BPS:1000}     # breaker: 10 % vs the last accepted consensus…
      move-interval: ${CRYPTOBOT_ORACLE_MOVE_INTERVAL:5m}     # …younger than this; also the plan-vs-oracle drift bound
    # Stale-but-honest prices used only when there is no consensus; the snapshot says "fallback-static".
    fallback-prices:
      SOL: 100
      USDC: 1
      USDT: 1
      JUP: 0.5
      BONK: 0.00002
      MSOL: 120
      JITOSOL: 118
    # devnet mint → mainnet mint it is valued as. Circle devnet USDC is built in; add your own here.
    aliases: {}
  # ---- ARS quotes across Argentine exchanges: GET /api/cryptobot/quotes/{asset} ----
  # Public, keyless, read-only price feeds only. One board per exchange, cached cache-ttl (30–60 s by
  # design); a failed refresh serves the previous board flagged stale while younger than stale-max.
  quotes:
    cache-ttl: ${CRYPTOBOT_QUOTES_CACHE_TTL:45s}
    stale-max: ${CRYPTOBOT_QUOTES_STALE_MAX:5m}
    timeout: ${CRYPTOBOT_QUOTES_TIMEOUT:5s}
    exchanges:
      bitso:
        enabled: ${CRYPTOBOT_QUOTES_BITSO_ENABLED:true}
        base-url: ${CRYPTOBOT_QUOTES_BITSO_BASE_URL:https://api.bitso.com}
      ripio:
        enabled: ${CRYPTOBOT_QUOTES_RIPIO_ENABLED:true}
        base-url: ${CRYPTOBOT_QUOTES_RIPIO_BASE_URL:https://app.ripio.com}
      buenbit:
        enabled: ${CRYPTOBOT_QUOTES_BUENBIT_ENABLED:true}
        base-url: ${CRYPTOBOT_QUOTES_BUENBIT_BASE_URL:https://be.buenbit.com}
    # Withdrawal fees in units of the asset, by exchange → asset → network. None of the three feeds
    # publishes fees on a public endpoint, so this table is maintained by hand from each exchange's
    # fee page and is reported as source=CONFIGURED (never as live). Empty by default on purpose:
    # an unknown fee is shown as "not applied", a made-up one would rank exchanges wrongly.
    # Example:
    #   ripio:
    #     USDT:
    #       TRON: 1
    withdrawal-fees: {}
  risk:
    concentration-high-pct: ${CRYPTOBOT_RISK_CONCENTRATION_HIGH:60}
    concentration-medium-pct: ${CRYPTOBOT_RISK_CONCENTRATION_MEDIUM:40}
    min-stable-pct: ${CRYPTOBOT_RISK_MIN_STABLE:10}
    dust-usd: 1
    sharp-move-pct: 5
  # mainnet is fail-closed. false (default) ⇒ a mainnet wallet or proposal is refused at
  # ExecutionService.execute (409 MAINNET_DISABLED) and at SolanaRpcClient.sendTransaction, before
  # anything is signed or sent; the signer has its own SIGNER_ALLOW_MAINNET. Do not flip this without
  # the readiness gate (CB-13). policy.execution-cluster below stays devnet regardless (belt and braces).
  execution:
    allow-mainnet: ${CRYPTOBOT_ALLOW_MAINNET:false}
  policy:
    # Emergency stop. false ⇒ nothing is ever signed or broadcast; proposals still work as paper trades.
    execution-enabled: ${CRYPTOBOT_EXECUTION_ENABLED:true}
    execution-cluster: devnet
    max-trade-usd: ${CRYPTOBOT_POLICY_MAX_TRADE_USD:500}
    max-trade-pct-of-portfolio: ${CRYPTOBOT_POLICY_MAX_TRADE_PCT:50}
    allowed-assets: SOL,USDC,USDT
    cooldown: ${CRYPTOBOT_POLICY_COOLDOWN:60s}
    # Destination of the executable SOL leg on devnet. Empty ⇒ proposals are approvable but not executable.
    rebalance-vault: ${CRYPTOBOT_REBALANCE_VAULT:}
    max-lamports-per-tx: ${CRYPTOBOT_POLICY_MAX_LAMPORTS:2000000000}
    proposal-ttl: 30m
    # versioned deterministic policy R_v (paper §8/§11/§18). Converted to integers at
    # startup; H_R = SHA-256 of the canonical record is committed in every verdict. Tiers by trade
    # value: ≤ autonomous-up-to ⇒ ALLOW · ≤ second-agent-up-to ⇒ ESCALATE(second agent) ·
    # ≤ max-trade-usd (above) ⇒ ESCALATE(human signature) · beyond ⇒ DENY. Bump `version` when
    # any value changes: proposals evaluated under another hash are refused at execution.
    authorization:
      version: ${CRYPTOBOT_POLICY_VERSION:cryptobot-policy-v1}
      autonomous-up-to-usd: ${CRYPTOBOT_POLICY_AUTONOMOUS_UP_TO_USD:100}
      second-agent-up-to-usd: ${CRYPTOBOT_POLICY_SECOND_AGENT_UP_TO_USD:250}
      daily-limit-usd: ${CRYPTOBOT_POLICY_DAILY_LIMIT_USD:2500}
      max-asset-exposure-bps: ${CRYPTOBOT_POLICY_MAX_ASSET_EXPOSURE_BPS:8000}
      max-slippage-bps: ${CRYPTOBOT_POLICY_MAX_SLIPPAGE_BPS:100}
      # The tolerance the executor applies; must be within max-slippage-bps or every trade is denied.
      executor-slippage-bps: ${CRYPTOBOT_POLICY_EXECUTOR_SLIPPAGE_BPS:50}
      # A plan priced on an older snapshot is denied (ORACLE_FRESH): refresh the wallet first.
      max-oracle-age: ${CRYPTOBOT_POLICY_MAX_ORACLE_AGE:15m}
      # env-overridable so a stack can enable POV_REWARD (Proof of Value payouts). Changing it changes H_R: the
      # validator's VALIDATOR_POLICY_ENABLED_STRATEGIES must match and VALIDATOR_POLICY_HASH be re-pinned (the demo does both).
      enabled-strategies: ${CRYPTOBOT_POLICY_ENABLED_STRATEGIES:REBALANCE}
    # timelock (paper §19): the wait between approval and the first moment the proposal can
    # be executed. A human can cancel (POST /proposals/{id}/cancel) while it runs. By tier of the
    # verdict: ALLOW ⇒ `autonomous` (none by default), ESCALATE ⇒ `escalated` (30 min). The
    # proposal's expiry is pushed to executable-at + execution-window at approval so the lock fits.
    timelock:
      autonomous: ${CRYPTOBOT_TIMELOCK_AUTONOMOUS:0s}
      escalated: ${CRYPTOBOT_TIMELOCK_ESCALATED:30m}
      execution-window: ${CRYPTOBOT_TIMELOCK_EXECUTION_WINDOW:30m}
  signer:
    enabled: ${CRYPTOBOT_SIGNER_ENABLED:false}
    base-url: ${CRYPTOBOT_SIGNER_BASE_URL:http://localhost:8096}
    # Shared service token (NOT a key). Must match SIGNER_TOKEN of cryptobot-signer.
    token: ${CRYPTOBOT_SIGNER_TOKEN:}
    timeout: 8s
  # independent validator (paper §20, level 5). A separate process with its own copy of
  # R_v pinned by hash; before signing, it re-derives the verdict over the recorded (I, S) and attests
  # the exact transaction bytes. The signer refuses without that attestation. Disabled or unreachable
  # ⇒ every proposal is a paper trade (VALIDATOR_AVAILABLE) and execution fails closed.
  validator:
    enabled: ${CRYPTOBOT_VALIDATOR_ENABLED:false}
    base-url: ${CRYPTOBOT_VALIDATOR_BASE_URL:http://localhost:8097}
    # Shared service token (NOT a key). Must match VALIDATOR_TOKEN of cryptobot-validator.
    token: ${CRYPTOBOT_VALIDATOR_TOKEN:}
    timeout: 8s
  # ---- Reliable execution (Endgame §31) ----
  # Outbox: events are written in the same transaction as the proposal state; the publisher hands
  # them to the OutboxSink (a structured log line until the broker of an internal ticket) with backoff, and
  # dead-letters them after max-attempts. Reconciliation: at startup and every `interval`, in-flight
  # proposals (EXECUTING/SUBMITTED) older than `grace` are resolved against getSignatureStatuses —
  # never re-sent. Ambiguous after max-attempts ⇒ dead letter (dlq_size > 0 is the alert).
  reliability:
    outbox:
      enabled: ${CRYPTOBOT_OUTBOX_ENABLED:true}
      poll-interval: ${CRYPTOBOT_OUTBOX_POLL_INTERVAL:2s}
      batch-size: 50
      max-attempts: 8
      initial-backoff: 1s
      max-backoff: 5m
    reconciliation:
      enabled: ${CRYPTOBOT_RECONCILIATION_ENABLED:true}
      interval: ${CRYPTOBOT_RECONCILIATION_INTERVAL:30s}
      # An in-flight row younger than this is assumed to belong to a live request and is left alone.
      grace: ${CRYPTOBOT_RECONCILIATION_GRACE:2m}
      max-attempts: ${CRYPTOBOT_RECONCILIATION_MAX_ATTEMPTS:20}
      batch-size: 100
      # a signature the chain never saw whose blockhash expired can never land — it is
      # re-executed under the SAME operationId (fresh blockhash, new signature) up to this many
      # times; then the trade is dead-lettered (retries_exhausted) for a human. 0 ⇒ never retried.
      max-retries: ${CRYPTOBOT_RECONCILIATION_MAX_RETRIES:2}
  # ---- an internal ticket: fault injection for the DEMO stack only (docker-compose.demo.yml). enabled=false ⇒ no
  # chaos bean, no /api/cryptobot/demo endpoint, the production SolanaRpcClient is the only one.
  chaos:
    enabled: ${CRYPTOBOT_CHAOS_ENABLED:false}
    # Mode armed at startup: uncertain | rpc-down | confirm-timeout (empty = nothing). Arm at runtime with
    # PUT /api/cryptobot/demo/chaos {"broadcast":"rpc-down","shots":-1}; shots -1 = until disarmed.
    broadcast: ${CRYPTOBOT_CHAOS_BROADCAST:}
    shots: ${CRYPTOBOT_CHAOS_SHOTS:1}
    # adversarial price armed at startup, e.g. "SOL:pyth-hermes:factor=0.1" (one source −90 % ⇒ PRICE_DEVIATION),
    # "SOL:*:age=900" (every source 15 min old ⇒ PRICE_STALE). Runtime: PUT /api/cryptobot/demo/price.
    price-override: ${CRYPTOBOT_DEMO_PRICE_OVERRIDE:}
  # ---- Business metrics: /actuator/prometheus, names in observability/CryptobotMetrics ----
  metrics:
    # Extra values allowed in the `asset` label, on top of policy.allowed-assets and monitoring.symbols.
    # Any other symbol is reported as `other` so a caller cannot create series (cardinality is bounded).
    assets: ${CRYPTOBOT_METRICS_ASSETS:}
  advisor:
    workflow-id: ${CRYPTOBOT_ADVISOR_WORKFLOW_ID:crypto.portfolio-advisor.v1}
    timeout: ${CRYPTOBOT_ADVISOR_TIMEOUT:90s}
    poll-interval: 1500ms
    locale: ${CRYPTOBOT_ADVISOR_LOCALE:en}
  # ---- Decision Receipts (Endgame §6-7) ----
  # signing-key: 64-byte Ed25519 secret (seed ‖ public key, the solana-keygen layout) in base64 or hex.
  # A secret: from secrets/, never a default here. Empty ⇒ ephemeral key at startup (dev only, WARN in the log).
  # salt-secret: the secret the per-tenant prompt-commitment salts derive from. Same rules.
  receipts:
    key-id: ${CRYPTOBOT_RECEIPT_KEY_ID:}
    signing-key: ${CRYPTOBOT_RECEIPT_SIGNING_KEY:}
    salt-secret: ${CRYPTOBOT_RECEIPT_SALT_SECRET:}
    price-table-version: ${CRYPTOBOT_RECEIPT_PRICE_TABLE:none}
    # a STRATEGY may declare REUSES over the wallet's latest MARKET_ANALYSIS of the same asset
    # if it is younger than this (Endgame §19 step 3). PT0S disables reuse.
    reuse-window: ${CRYPTOBOT_RECEIPT_REUSE_WINDOW:1h}
  # ---- Anchoring on Solana devnet (Endgame §11) ----
  # One SPL Memo transaction per batch: `ir/1 root=<sha256> n=<count> ts=<…>`, signed by the isolated
  # signer (which re-derives the memo from the bytes and only signs it on devnet). Receipts carry the
  # anchor + Merkle proof only once the transaction is FINALIZED; a dropped/reorged one is re-sent
  # for the same root (idempotent). `cluster` accepts only devnet — anything else refuses to start.
  # The job is off by default (needs the signer); POST /api/cryptobot/anchors (RUNTIME_ADMIN) runs a sweep.
  anchor:
    enabled: ${CRYPTOBOT_ANCHOR_ENABLED:false}
    cluster: devnet
    interval: ${CRYPTOBOT_ANCHOR_INTERVAL:60s}
    batch-size: ${CRYPTOBOT_ANCHOR_BATCH_SIZE:256}
    max-attempts: ${CRYPTOBOT_ANCHOR_MAX_ATTEMPTS:5}
    finality-wait: ${CRYPTOBOT_ANCHOR_FINALITY_WAIT:60s}
    poll-interval: 2s
  # Proof of Value V5, immediate reward: POST /api/cryptobot/value-events/{id}/distribute (RUNTIME_ADMIN) pays an
  # ANCHORED event's pool to its contributors' wallets in devnet SOL, one attested + signed transfer per wallet. Off by default;
  # the demo compose turns it on. The signer only pays wallets in SIGNER_ALLOWED_DESTINATIONS and never more than
  # SIGNER_MAX_LAMPORTS per transaction; the policy must enable `strategy-id` (CRYPTOBOT_POLICY_ENABLED_STRATEGIES).
  pov:
    reward:
      enabled: ${POV_REWARD_ENABLED:false}
      pool-lamports: ${POV_REWARD_POOL_LAMPORTS:10000000}
      strategy-id: ${POV_REWARD_STRATEGY_ID:POV_REWARD}
    # Proof of Value V7, pov/revenue-share/v1 (fixed, auditable): POST /api/cryptobot/revenue-events (RUNTIME_ADMIN) splits an
    # economic result: contributor pool (paid with the V5 flow, so it needs the reward enabled), protocol fee (only recorded), retained.
    # V8: treasury-identity-id is the agent whose accounting treasury earns revenue and pays the PoV payouts.
    revenue:
      contributor-share-bps: ${POV_REVENUE_CONTRIBUTOR_SHARE_BPS:2000}
      protocol-fee-bps: ${POV_REVENUE_PROTOCOL_FEE_BPS:500}
      treasury-identity-id: ${POV_TREASURY_IDENTITY_ID:cryptobot-001}

lifeengine:
  # Deployment environment for build identity (/actuator/info) and metric common tags. From APP_ENV —
  # never hardcoded per environment (§2.2).
  deployment:
    env: ${APP_ENV:local}
  # `json` (default, lo que lee Promtail/Loki) o `text` (una consola con un humano).
  # Ver logback-spring.xml.
  logging:
    format: ${LOG_FORMAT:json}
  security:
    jwt:
      secret: ${JWT_SECRET:}
    jwks:
      uri: ${AUTH_JWKS_URI:}
  cryptobot:
    security:
      # Phase-1 bridge: while life-engine-auth has not yet seeded RUNTIME_VIEWER /
      # RUNTIME_OPERATOR / RUNTIME_ADMIN permissions (auth db/migration/V49__auth_rbac.sql),
      # mint them locally from the JWT `role` claim and ROLE_ADMIN so the runtime can call
      # /api/cryptobot/** with a forwarded user token. Set to `false` once auth ships
      # proper RUNTIME_* permission rows + role mappings.
      derive-runtime-authorities-from-role: ${CRYPTOBOT_DERIVE_RUNTIME_AUTHORITIES:true}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics, info
  # el tracer siempre está activo para que cada línea de log lleve traceId/spanId (y para
  # propagar traceparent hacia Runtime, signer y validator). Exportar a un collector es una decisión
  # por entorno: MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED=true + OTEL_EXPORTER_OTLP_ENDPOINT. Apagado por
  # default: sin collector no se intenta nada contra localhost:4318.
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED:false}
  # BuildIdentityConfig owns /actuator/info in the exact shape of LIFE-OPS-02 §2.2. The stock env/git/build
  # contributors are disabled so they cannot pollute or reshape that contract.
  info:
    env:
      enabled: false
    git:
      enabled: false
    build:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Build identity overrides. Empty by default: local and CI builds carry a .git directory, so git.properties
# (git-commit-id) is the source. A future Docker image with no .git would pass these as
# build-args → env, and BuildIdentityResolver prefers them. Never a secret.
identity:
  git:
    commit: ${GIT_COMMIT:}
    branch: ${GIT_BRANCH:}
    commit-time: ${GIT_COMMIT_TIME:}

logging:
  # el formato lo decide logback-spring.xml (json | text); el pattern plano con
  # marketReviewId/runtimeRunId que había acá nunca se llenaba (nadie escribía ese MDC).
  level:
    root: INFO
    io.lifeengine.cryptobot: INFO
