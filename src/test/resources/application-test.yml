spring:
  # No Postgres in the unit/contract tests. R2DBC + Flyway are excluded from the
  # auto-configuration here; controller and service tests stub repositories.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.r2dbc.R2dbcAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.r2dbc.R2dbcRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
  flyway:
    enabled: false

cryptobot:
  runtime:
    base-url: http://localhost:0
    workflow-id: crypto.market-review.v1
  snapshot:
    provider: deterministic-local
  security:
    enabled: true
  binance:
    base-url: http://localhost:0
    timeout: 1s
  monitoring:
    enabled: false
    symbols: BTCUSDT,SOLUSDT
    interval: 10m
    workflow-id: crypto.market-review.v1

  solana:
    rpc:
      devnet-url: http://localhost:0
      mainnet-url: http://localhost:0
      timeout: 2s
  # KAN-439: no network in tests — every price source is off and points at a closed port. With no source the
  # oracle has no consensus: the portfolio is valued from the labelled fallback and the policy DENIES. The flow
  # test enables the three sources against its own fake feed (all agreeing on SOL $100 / USDC $1).
  marketdata:
    jupiter-enabled: false
    jupiter-base-url: http://localhost:0
    pyth:
      enabled: false
      base-url: http://localhost:0
    coingecko:
      enabled: false
      base-url: http://localhost:0
    coinbase:
      enabled: false
      base-url: http://localhost:0
    fallback-prices:
      SOL: 100
      USDC: 1
      USDT: 1
  quotes:
    cache-ttl: 45s
    stale-max: 5m
    timeout: 1s
    # No network in tests: every adapter points at a closed port; the controller test overrides the port bean.
    exchanges:
      bitso:
        base-url: http://localhost:0
      ripio:
        base-url: http://localhost:0
      buenbit:
        base-url: http://localhost:0
  policy:
    execution-enabled: true
    execution-cluster: devnet
    max-trade-usd: 500
    max-trade-pct-of-portfolio: 50
    allowed-assets: SOL,USDC,USDT
    cooldown: 60s
    rebalance-vault: 9xQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9PusVFin
    max-lamports-per-tx: 2000000000
    authorization:
      version: test-policy-v1
      autonomous-up-to-usd: 100
      second-agent-up-to-usd: 250
      daily-limit-usd: 2500
      max-asset-exposure-bps: 8000
      max-slippage-bps: 100
      executor-slippage-bps: 50
      max-oracle-age: 15m
      enabled-strategies: REBALANCE
  signer:
    enabled: false
  # KAN-403: no background loops in the test slice; tests call tick()/sweep() explicitly.
  reliability:
    outbox:
      enabled: false
    reconciliation:
      enabled: false
  advisor:
    workflow-id: crypto.portfolio-advisor.v1
    timeout: 5s
    poll-interval: 100ms
  # KAN-394: no background loop; the flow test calls POST /anchors with a fake signer + fake RPC.
  anchor:
    enabled: false
    cluster: devnet
    batch-size: 64
    max-attempts: 3
    finality-wait: 2s
    poll-interval: 100ms
lifeengine:
  security:
    jwt:
      secret: test-jwt-secret-at-least-32-bytes-long!!

logging:
  level:
    io.lifeengine.cryptobot: INFO
