name: ci

on:
  push:
    branches: [main]
  # NUNCA pull_request_target: el CI de PRs (incl. forks) corre sin secretos y con token de solo lectura.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (java 21, ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          ./mvnw -v

      - name: Compile (main + test sources)
        run: ./mvnw -B -ntp -DskipTests test-compile

      - name: Run tests (surefire)
        run: ./mvnw -B -ntp test

      # Testcontainers Postgres para ActionProposalR2dbcStore (optimistic lock, operation_id unico,
      # commit atomico), OutboxEventR2dbcStore (SKIP LOCKED), DeadLetterR2dbcStore y el Proof of
      # Value (PovR2dbcStoreIT, ProofOfValueApiIT): clases *IT que Surefire no toma por defecto.
      # El runner hosteado de GitHub trae Docker nativo (un job = una VM efimera): sin reintento.
      - name: Run Postgres integration tests (Testcontainers)
        run: ./mvnw -B -ntp -Dtest=ActionProposalR2dbcStoreIT,OutboxEventR2dbcStoreIT,DeadLetterR2dbcStoreIT,PovR2dbcStoreIT,ProofOfValueApiIT,ProofOfValueRewardApiIT,ProofOfValueRevenueApiIT,PaperR2dbcStoreIT test

      - name: Run signer tests (isolated module, own pom)
        run: ./mvnw -B -ntp -f signer/pom.xml test

      # Piloto (firma de swaps): mutation testing de lo que decide qué se firma con plata real. Falla por debajo
      # del umbral de signer/pom.xml (mutationThreshold).
      - name: Signer swap policy mutation testing (PIT)
        run: ./mvnw -B -ntp -f signer/pom.xml test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Run validator tests (isolated module, own pom)
        run: ./mvnw -B -ntp -f validator/pom.xml test

      # the demo scripts (run.sh / e2e-devnet.sh): argument validation, --dry-run plan,
      # gitignore of the secret files, shellcheck when the runner has it. Offline: no compose is started.
      - name: Demo scripts (scripts/demo/tests/test-run.sh)
        run: scripts/demo/tests/test-run.sh
      - name: Paper report script (scripts/paper/tests/test-paper-report.sh)
        run: scripts/paper/tests/test-paper-report.sh
      - name: Proof of Value collector (scripts/pov/tests/test-pov-collector.sh)
        run: scripts/pov/tests/test-pov-collector.sh

      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # la cadena completa una vez, con los gates y el pipeline juntos (ChainE2EIT):
  # el service real sobre sus stores R2DBC (Postgres por Testcontainers), validator y signer
  # como PROCESOS reales (los jars de sus módulos), RPC de Solana y Runtime mockeados por HTTP.
  # Tres escenarios: EXECUTED con receipt + reconciliación; validator caído ⇒ FAILED sin
  # sendTransaction; attestation corrupta ⇒ el signer la rechaza. Sin este job verde no se
  # publica imagen (docker-publish depende de él).
  #
  # Corre en runner hosteado de GitHub (ubuntu-24.04, Docker nativo para Testcontainers). KAN-1140:
  # el repo es PUBLICO y un runner self-hosted con pull_request es una superficie de ejecucion
  # remota (FND-071); por eso ya no se usa le-ci.
  # ---------------------------------------------------------------------------
  e2e-chain:
    name: e2e chain (service + signer + validator, failsafe)
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Empaquetar validator y signer (los procesos del E2E)
        run: |
          ./mvnw -B -ntp -f validator/pom.xml -DskipTests package
          ./mvnw -B -ntp -f signer/pom.xml -DskipTests package

      - name: E2E de la cadena (failsafe, perfil e2e-chain)
        run: ./mvnw -B -ntp -Pe2e-chain verify

      - name: Evidencia del E2E
        if: always()
        run: |
          echo "## ChainE2EIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/e2e-chain/evidence.txt ]; then
            sed 's/^/- /' target/e2e-chain/evidence.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- sin evidencia (el stack no llegó a correr)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Failsafe reports + logs de los procesos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chain-reports
          path: |
            target/failsafe-reports/**
            target/e2e-chain/**
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # el programa Solana (programs/intent-authority) se testea en el host, sin
  # toolchain SBF: `solana-program-test` corre el processor nativo contra un banco real.
  # Rust se instala en el runner por acción; la cache de
  # cargo evita recompilar los ~560 crates de solana-program-test en cada run.
  # ---------------------------------------------------------------------------
  program-test:
    name: solana program (cargo test, host)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: programs/intent-authority

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/intent-authority

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          cc --version | head -1

      - name: cargo test (unit + bank simulator + vectors)
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # publicar la imagen. Copia del job de life-engine-runtime: hasta acá este
  # repo sólo compilaba y testeaba, así que no existía ningún artefacto que uat-compose
  # pudiera desplegar por digest, y ningún tablero de CryptoBot podía mostrar nada.
  #
  # una imagen por módulo. `signer/` y `validator/` tienen pom, Dockerfile e
  # imagen propios y UAT los corre como contenedores por digest,
  # pero este job construía sólo el context `.`: `resolve-artifact.sh cryptobot-signer <sha>`
  # daba 404 y `ops uat deploy cryptobot-signer` sólo salía por el fallback manual
  # (buildSource=manual-fallback), que an internal ticket quiere que sea la excepción. La matrix
  # publica los tres paquetes con la misma forma (login, metadata-action, labels OCI,
  # cache gha con scope por módulo para que no se pisen). Los nombres de paquete son los
  # que ya esperan ops.d/lib/services.sh, resolve-artifact.sh y platform-catalog.yml en
  # deploy: cambiarlos acá obliga a cambiarlos allá.
  #
  # Los paquetes ghcr.io/sebdev89/life-engine-cryptobot-{service,signer,validator} ya existen
  # (GITHUB_TOKEN, mismo owner); su visibilidad es la del paquete, no la del repo. El host que
  # despliega necesita `docker login ghcr.io` con un PAT read:packages. Este job solo corre en
  # push a main (nunca en pull_request); es el unico con packages: write.
  #
  # Sin `outputs:` a nivel job: con una matrix, un output lo escribe el último leg que
  # termina y no dice de qué módulo es. La identidad del artefacto (repository/tag/digest/
  # revision) va al run summary, una tabla por módulo, y el deploy la resuelve contra GHCR
  # por tag + label `org.opencontainers.image.revision` (resolve-artifact.sh), nunca por
  # outputs del job.
  # ---------------------------------------------------------------------------
  docker-publish:
    name: docker build + push (${{ matrix.module }})
    runs-on: ubuntu-24.04
    # sin la cadena completa verde no hay imagen.
    needs: [build-and-test, e2e-chain]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      # Que falle el signer no tiene que cancelar la imagen del servicio: cada paquete
      # se despliega por separado.
      fail-fast: false
      matrix:
        include:
          - module: service
            context: .
            dockerfile: Dockerfile
            package: life-engine-cryptobot-service
          - module: signer
            context: signer
            dockerfile: signer/Dockerfile
            package: life-engine-cryptobot-signer
          - module: validator
            context: validator
            dockerfile: validator/Dockerfile
            package: life-engine-cryptobot-validator

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `git describe` necesita los tags, y el default de checkout (fetch-depth: 1)
          # no los trae. Sin esto la version caeria siempre al sha corto.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable sha- tags only. 'latest' is a moving pointer and is banned across the platform
      # (internal ticket no-latest guard); deploys resolve by digest/sha, never by latest. metadata-action still
      # stamps org.opencontainers.image.revision=<sha> into the labels, so the image keeps its OCI revision.
      # La version sale del tag de git, no del pom.xml (`0.0.1-SNAPSHOT`, nunca tocado).
      # `--match 'v*'` evita tomar tags de otra convencion; `--always` cae al sha corto en
      # un repo sin tags (este, hoy). Los tres módulos comparten commit y tag: misma versión.
      - name: Versión desde el tag
        id: version
        run: |
          semver="$(git describe --tags --match 'v*' --always)"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "versión: ${semver}"

      # label life-engine.commit/version = commit REAL de la build (7 chars, como los tags sha-).
      - name: Commit corto
        id: short
        run: echo "sha7=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          tags: |
            type=sha,prefix=sha-
          # La procedencia va en el propio artefacto, no en el manifiesto: `ops` la lee de la
          # imagen y, si el label no está, registra `buildSource=unknown` en vez de asumir CI
          # —afirmarlo sin evidencia sería falsificar CI.
          # `build.reason` no se estampa a propósito: sólo lo exige `manual-fallback`.
          labels: |
            life-engine.semver=${{ steps.version.outputs.semver }}
            life-engine.build.source=github-actions
            life-engine.module=${{ matrix.module }}
            life-engine.commit=${{ steps.short.outputs.sha7 }}
            life-engine.version=sha-${{ steps.short.outputs.sha7 }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Real git identity for /actuator/info: the build context has no .git, so pass it explicitly.
          # Los tres Dockerfiles declaran los mismos ARG GIT_*: misma identidad de build.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT_TIME=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT_SHORT=${{ steps.short.outputs.sha7 }}
          # scope por módulo: sin él los tres legs comparten la cache `buildkit` y se pisan
          # (el último en exportar gana y los otros dos arrancan fríos en el próximo run).
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

      # T9: publish the digest of the image we just pushed. build-push-action reports the
      # immutable digest in steps.build.outputs.digest — surface it in the run summary (gh run view),
      # so the deploy can resolve commit -> digest straight from the run instead of querying GHCR by
      # hand. No credentials here.
      - name: Expose published image digest
        id: image-metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          MODULE: ${{ matrix.module }}
        run: |
          short="${GITHUB_SHA:0:7}"
          tag="sha-${short}"
          {
            echo "## Published image — ${MODULE}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| module | \`${MODULE}\` |"
            echo "| repository | \`${REPOSITORY}\` |"
            echo "| tag | \`${tag}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| oci.revision | \`${GITHUB_SHA}\` |"
            echo "| commit | \`${short}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
