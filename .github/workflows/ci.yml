name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (java 21, ubuntu)
    runs-on: [self-hosted, le-ci]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          ./mvnw -v

      - name: Compile (main + test sources)
        run: ./mvnw -B -ntp -DskipTests test-compile

      - name: Run tests (surefire)
        run: ./mvnw -B -ntp test

      # KAN-604 — Testcontainers Postgres for ActionProposalR2dbcStore (optimistic lock, unique
      # operation_id, atomic commit), OutboxEventR2dbcStore (SKIP LOCKED) and DeadLetterR2dbcStore
      # (single resolution): *IT classes Surefire's default patterns do not pick up, run here
      # explicitly. le-ci has Docker; KAN-296 — several Testcontainers jobs in parallel can produce
      # a false red ("bind: address already in use") from port contention between runners, not a
      # code regression, so one retry absorbs that before failing the build for real.
      - name: Run Postgres integration tests (Testcontainers)
        run: |
          for attempt in 1 2; do
            if ./mvnw -B -ntp -Dtest=ActionProposalR2dbcStoreIT,OutboxEventR2dbcStoreIT,DeadLetterR2dbcStoreIT test; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ] && grep -q "bind: address already in use" target/surefire-reports/*.txt 2>/dev/null; then
              echo "KAN-296: port contention between parallel Testcontainers jobs — retrying once."
              continue
            fi
            exit 1
          done

      - name: Run signer tests (isolated module, own pom)
        run: ./mvnw -B -ntp -f signer/pom.xml test

      - name: Run validator tests (KAN-438 — isolated module, own pom)
        run: ./mvnw -B -ntp -f validator/pom.xml test

      # KAN-575 — the demo scripts (run.sh / e2e-devnet.sh): argument validation, --dry-run plan,
      # gitignore of the secret files, shellcheck when the runner has it. Offline: no compose is started.
      - name: Demo scripts (scripts/demo/tests/test-run.sh)
        run: scripts/demo/tests/test-run.sh

      - name: Upload Surefire reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # KAN-500 — la cadena completa una vez, con los gates y el pipeline juntos (ChainE2EIT):
  # el service real sobre sus stores R2DBC (Postgres por Testcontainers), validator y signer
  # como PROCESOS reales (los jars de sus módulos), RPC de Solana y Runtime mockeados por HTTP.
  # Tres escenarios: EXECUTED con receipt + reconciliación; validator caído ⇒ FAILED sin
  # sendTransaction; attestation corrupta ⇒ el signer la rechaza. Sin este job verde no se
  # publica imagen (docker-publish depende de él).
  #
  # Testcontainers en le-ci: el único daemon accesible es el rootless del runner (DOCKER_HOST lo
  # inyecta su unidad systemd); se verifica antes de levantar nada, como en life-engine-auth.
  # ---------------------------------------------------------------------------
  e2e-chain:
    name: e2e chain (service + signer + validator, failsafe)
    runs-on: [self-hosted, le-ci]
    needs: build-and-test
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verificar que el daemon disponible es el rootless
        run: |
          echo "DOCKER_HOST=${DOCKER_HOST:-<no seteado>}"
          docker info --format 'root dir: {{.DockerRootDir}} · {{.SecurityOptions}}'
          docker info --format '{{.SecurityOptions}}' | grep -q 'name=rootless' || {
            echo "::error::el daemon visible no es rootless — Testcontainers no debe correr acá"
            exit 1
          }

      - name: Empaquetar validator y signer (los procesos del E2E)
        run: |
          ./mvnw -B -ntp -f validator/pom.xml -DskipTests package
          ./mvnw -B -ntp -f signer/pom.xml -DskipTests package

      - name: E2E de la cadena (failsafe, perfil e2e-chain)
        run: ./mvnw -B -ntp -Pe2e-chain verify
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Evidencia del E2E
        if: always()
        run: |
          echo "## ChainE2EIT" >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/e2e-chain/evidence.txt ]; then
            sed 's/^/- /' target/e2e-chain/evidence.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- sin evidencia (el stack no llegó a correr)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Failsafe reports + logs de los procesos (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-chain-reports
          path: |
            target/failsafe-reports/**
            target/e2e-chain/**
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # KAN-437 — el programa Solana (programs/intent-authority) se testea en el host, sin
  # toolchain SBF: `solana-program-test` corre el processor nativo contra un banco real.
  # Rust se instala en el runner por acción (no está en la imagen de le-ci); la cache de
  # cargo evita recompilar los ~560 crates de solana-program-test en cada run.
  # ---------------------------------------------------------------------------
  program-test:
    name: solana program (cargo test, host)
    runs-on: [self-hosted, le-ci]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: programs/intent-authority

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/intent-authority

      - name: Show toolchain
        run: |
          cargo --version
          rustc --version
          cc --version | head -1

      - name: cargo test (unit + bank simulator + vectors)
        run: cargo test --locked

  # ---------------------------------------------------------------------------
  # KAN-352 — publicar la imagen. Copia del job de life-engine-runtime: hasta acá este
  # repo sólo compilaba y testeaba, así que no existía ningún artefacto que uat-compose
  # pudiera desplegar por digest, y ningún tablero de CryptoBot podía mostrar nada.
  #
  # KAN-579 — una imagen por módulo. `signer/` y `validator/` tienen pom, Dockerfile e
  # imagen propios (KAN-438/KAN-570) y UAT los corre como contenedores por digest (KAN-574),
  # pero este job construía sólo el context `.`: `resolve-artifact.sh cryptobot-signer <sha>`
  # daba 404 y `ops uat deploy cryptobot-signer` sólo salía por el fallback manual
  # (buildSource=manual-fallback), que KAN-258 quiere que sea la excepción. La matrix
  # publica los tres paquetes con la misma forma (login, metadata-action, labels OCI,
  # cache gha con scope por módulo para que no se pisen). Los nombres de paquete son los
  # que ya esperan ops.d/lib/services.sh, resolve-artifact.sh y platform-catalog.yml en
  # deploy: cambiarlos acá obliga a cambiarlos allá.
  #
  # El repo es PRIVADO: los paquetes ghcr.io/sebdev89/life-engine-cryptobot-{service,signer,
  # validator} heredan esa visibilidad en su primera publicación (GITHUB_TOKEN, mismo owner).
  # Verificarlo después del primer run: gh api /user/packages/container/<paquete>
  # -q .visibility → private. El host que despliega necesita `docker login ghcr.io`
  # con un PAT read:packages (ya lo tiene para runtime, privado desde KAN-349).
  #
  # Sin `outputs:` a nivel job: con una matrix, un output lo escribe el último leg que
  # termina y no dice de qué módulo es. La identidad del artefacto (repository/tag/digest/
  # revision) va al run summary, una tabla por módulo, y el deploy la resuelve contra GHCR
  # por tag + label `org.opencontainers.image.revision` (resolve-artifact.sh), nunca por
  # outputs del job.
  # ---------------------------------------------------------------------------
  docker-publish:
    name: docker build + push (${{ matrix.module }})
    runs-on: [self-hosted, le-ci]
    # KAN-500: sin la cadena completa verde no hay imagen.
    needs: [build-and-test, e2e-chain]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      # Que falle el signer no tiene que cancelar la imagen del servicio: cada paquete
      # se despliega por separado.
      fail-fast: false
      matrix:
        include:
          - module: service
            context: .
            dockerfile: Dockerfile
            package: life-engine-cryptobot-service
          - module: signer
            context: signer
            dockerfile: signer/Dockerfile
            package: life-engine-cryptobot-signer
          - module: validator
            context: validator
            dockerfile: validator/Dockerfile
            package: life-engine-cryptobot-validator

    steps:
      # KAN-488: config de Docker aislada por job. Los runners de la VM le-ci comparten el
      # ~/.docker/config.json del usuario del runner, y el post-step de docker/login-action
      # hace `docker logout` global: si el job de otro repo termina primero, el push de este
      # falla con `denied: permission_denied: read_package`. Con DOCKER_CONFIG en $RUNNER_TEMP
      # cada job tiene su propio config.json; login, buildx y logout lo leen del env.
      # Cada leg de la matrix es un job con su propio $RUNNER_TEMP, así que no se pisan.
      #
      # Va como step y no como `jobs.<id>.env`: el contexto `runner` no existe a nivel job
      # (sólo github/needs/strategy/matrix/vars/secrets/inputs) y el workflow entero fallaba
      # con 0 jobs ("workflow file issue"). GITHUB_ENV propaga la variable a los steps
      # siguientes y a sus post-steps, incluido el logout de docker/login-action.
      - name: Docker config aislada por job (KAN-488)
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # `git describe` necesita los tags, y el default de checkout (fetch-depth: 1)
          # no los trae. Sin esto la version caeria siempre al sha corto.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable sha- tags only. 'latest' is a moving pointer and is banned across the platform
      # (KAN-193 no-latest guard); deploys resolve by digest/sha, never by latest. metadata-action still
      # stamps org.opencontainers.image.revision=<sha> into the labels, so the image keeps its OCI revision.
      # La version sale del tag de git, no del pom.xml (`0.0.1-SNAPSHOT`, nunca tocado).
      # `--match 'v*'` evita tomar tags de otra convencion; `--always` cae al sha corto en
      # un repo sin tags (este, hoy). Los tres módulos comparten commit y tag: misma versión.
      - name: Versión desde el tag
        id: version
        run: |
          semver="$(git describe --tags --match 'v*' --always)"
          echo "semver=${semver}" >> "$GITHUB_OUTPUT"
          echo "versión: ${semver}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          tags: |
            type=sha,prefix=sha-
          # La procedencia va en el propio artefacto, no en el manifiesto: `ops` la lee de la
          # imagen y, si el label no está, registra `buildSource=unknown` en vez de asumir CI
          # —afirmarlo sin evidencia sería falsificar CI (KAN-258).
          # `build.reason` no se estampa a propósito: sólo lo exige `manual-fallback`.
          labels: |
            life-engine.semver=${{ steps.version.outputs.semver }}
            life-engine.build.source=github-actions
            life-engine.module=${{ matrix.module }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Real git identity for /actuator/info: the build context has no .git, so pass it explicitly.
          # Los tres Dockerfiles declaran los mismos ARG GIT_* (KAN-579): misma identidad de build.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
            GIT_COMMIT_TIME=${{ github.event.head_commit.timestamp }}
          # scope por módulo: sin él los tres legs comparten la cache `buildkit` y se pisan
          # (el último en exportar gana y los otros dos arrancan fríos en el próximo run).
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

      # KAN-200 / T9: publish the digest of the image we just pushed. build-push-action reports the
      # immutable digest in steps.build.outputs.digest — surface it in the run summary (gh run view),
      # so the deploy can resolve commit -> digest straight from the run instead of querying GHCR by
      # hand. No credentials here.
      - name: Expose published image digest
        id: image-metadata
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ghcr.io/${{ github.repository_owner }}/${{ matrix.package }}
          MODULE: ${{ matrix.module }}
        run: |
          short="${GITHUB_SHA:0:7}"
          tag="sha-${short}"
          {
            echo "## Published image — ${MODULE}"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| module | \`${MODULE}\` |"
            echo "| repository | \`${REPOSITORY}\` |"
            echo "| tag | \`${tag}\` |"
            echo "| digest | \`${DIGEST}\` |"
            echo "| oci.revision | \`${GITHUB_SHA}\` |"
            echo "| commit | \`${short}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
