# CryptoBot hackathon stack: independent validator + isolated signer + service + UI. Auth, Runtime
# and Postgres are the existing Life Engine dev processes on the host. Never points at le-*/le-uat-*.
name: cryptobot-hackathon

services:
  # KAN-438 (paper §20): a process that is not the agent. Own copy of the policy pinned by hash,
  # own attestation key (moves nothing). No published port: only cryptobot-service reaches it.
  cryptobot-validator:
    build: ./validator
    container_name: cryptobot-validator
    environment:
      VALIDATOR_PORT: "8097"
      VALIDATOR_KEYPAIR_PATH: /run/secrets/validator-keypair
      VALIDATOR_TOKEN: ${VALIDATOR_TOKEN}
      VALIDATOR_POLICY_HASH: ${VALIDATOR_POLICY_HASH}
      VALIDATOR_POLICY_MAX_TRADE_VALUE_CENTS: ${VALIDATOR_POLICY_MAX_TRADE_VALUE_CENTS:-50000}
      VALIDATOR_POLICY_DAILY_LIMIT_CENTS: ${VALIDATOR_POLICY_DAILY_LIMIT_CENTS:-250000}
      VALIDATOR_POLICY_AUTONOMOUS_UP_TO_CENTS: ${VALIDATOR_POLICY_AUTONOMOUS_UP_TO_CENTS:-10000}
      VALIDATOR_POLICY_SECOND_AGENT_UP_TO_CENTS: ${VALIDATOR_POLICY_SECOND_AGENT_UP_TO_CENTS:-25000}
    volumes:
      - ${VALIDATOR_KEYPAIR_HOST_PATH}:/run/secrets/validator-keypair:ro
    # KAN-570: the key file is 0600 on the host; run as its owner so the container can read it.
    user: "${DEMO_UID:-1000}"
    networks: [cryptobot]

  cryptobot-signer:
    build: ./signer
    container_name: cryptobot-signer
    environment:
      SIGNER_PORT: "8096"
      SIGNER_KEYPAIR_PATH: /run/secrets/signer-keypair
      SIGNER_TOKEN: ${SIGNER_TOKEN}
      SIGNER_ALLOWED_DESTINATIONS: ${SIGNER_ALLOWED_DESTINATIONS}
      SIGNER_MAX_LAMPORTS: ${SIGNER_MAX_LAMPORTS:-2000000000}
      SIGNER_CLUSTER: devnet
      # KAN-438: without the validator's public key the signer signs nothing.
      SIGNER_VALIDATOR_PUBLIC_KEY: ${SIGNER_VALIDATOR_PUBLIC_KEY}
      SIGNER_REQUIRE_ATTESTATION: "true"
    volumes:
      - ${SIGNER_KEYPAIR_HOST_PATH}:/run/secrets/signer-keypair:ro
    user: "${DEMO_UID:-1000}"
    networks: [cryptobot]
    # No published port: only cryptobot-service can reach the signer.

  cryptobot-service:
    build: .
    container_name: cryptobot-service
    depends_on: [cryptobot-validator, cryptobot-signer]
    environment:
      CRYPTOBOT_SERVICE_PORT: "8091"
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: ${JWT_SECRET}
      AUTH_JWKS_URI: ${AUTH_JWKS_URI}
      CRYPTOBOT_RUNTIME_BASE_URL: ${CRYPTOBOT_RUNTIME_BASE_URL}
      CRYPTOBOT_JDBC_URL: ${CRYPTOBOT_JDBC_URL}
      CRYPTOBOT_R2DBC_URL: ${CRYPTOBOT_R2DBC_URL}
      CRYPTOBOT_DB_USER: ${CRYPTOBOT_DB_USER}
      CRYPTOBOT_DB_PASSWORD: ${CRYPTOBOT_DB_PASSWORD}
      CRYPTOBOT_SNAPSHOT_PROVIDER: solana-public
      CRYPTOBOT_REBALANCE_VAULT: ${CRYPTOBOT_REBALANCE_VAULT}
      CRYPTOBOT_SIGNER_ENABLED: "true"
      CRYPTOBOT_SIGNER_BASE_URL: http://cryptobot-signer:8096
      CRYPTOBOT_SIGNER_TOKEN: ${CRYPTOBOT_SIGNER_TOKEN}
      CRYPTOBOT_VALIDATOR_ENABLED: "true"
      CRYPTOBOT_VALIDATOR_BASE_URL: http://cryptobot-validator:8097
      CRYPTOBOT_VALIDATOR_TOKEN: ${CRYPTOBOT_VALIDATOR_TOKEN}
      CRYPTOBOT_TIMELOCK_ESCALATED: ${CRYPTOBOT_TIMELOCK_ESCALATED:-30m}
      CRYPTOBOT_ADVISOR_LOCALE: ${CRYPTOBOT_ADVISOR_LOCALE:-es}
      CRYPTOBOT_EXECUTION_ENABLED: ${CRYPTOBOT_EXECUTION_ENABLED:-true}
      CRYPTOBOT_HTTP_CORS_ALLOWED_ORIGINS: http://localhost:${UI_PORT:-4204},http://127.0.0.1:${UI_PORT:-4204}
    ports:
      - "127.0.0.1:8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cryptobot]

  cryptobot-ui:
    build: ../cryptobot-ui
    container_name: cryptobot-ui
    environment:
      UI_AUTH_BASE: ${UI_AUTH_BASE:-http://localhost:8081}
      UI_CRYPTOBOT_BASE: ${UI_CRYPTOBOT_BASE:-http://localhost:8091}
      UI_DEMO_CLUSTER: ${UI_DEMO_CLUSTER:-devnet}
    ports:
      - "127.0.0.1:${UI_PORT:-4204}:80"
    networks: [cryptobot]

networks:
  cryptobot: {}
