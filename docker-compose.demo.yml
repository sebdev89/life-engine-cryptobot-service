# the CryptoBot demo stack, self-contained: its own Postgres, the independent validator,
# the isolated signer and the service, wired for REAL execution on Solana devnet.
#
#   scripts/demo/wallet-devnet.sh                                   # keys + .env.demo + airdrop (once)
#   docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build
#   scripts/demo/e2e-devnet.sh                                      # the flow by API + out/evidence-<ts>.md
#   scripts/demo/e2e-devnet.sh --chaos rpc-down                     # injected failure → reconciliation → DLQ → requeue → retry
#
# Plan B when devnet's faucet/RPC is not cooperating: the same stack against a local validator
# (`--profile local-validator`, RPC http://solana-local:8899; unlimited airdrop). The pipeline is
# byte-for-byte the same; only the RPC URL changes and the explorer link does not resolve.
#
# What is deliberately NOT here: Life Engine Auth and Runtime. The JWT is HS256 with the demo's
# own JWT_SECRET (the scripts mint the token); the LLM advisor (runtime PR #33) is optional and
# not on the E2E path. Nothing here points at le-*/le-uat-*; the project name and network are
# its own. Secrets come from .env.demo (gitignored) and the key files are mounted read-only.
# CRYPTOBOT_DEMO_PROJECT: another project name = another set of containers, volumes and
# network - how run.sh proves "from zero" without touching the stack of a previous rehearsal.
name: ${CRYPTOBOT_DEMO_PROJECT:-cryptobot-demo}

services:
  demo-postgres:
    image: postgres:16-alpine
    container_name: ${CRYPTOBOT_DEMO_PROJECT:-cryptobot-demo}-postgres
    environment:
      POSTGRES_DB: life_engine_cryptobot
      POSTGRES_USER: ${CRYPTOBOT_DB_USER:-cryptobot}
      POSTGRES_PASSWORD: ${CRYPTOBOT_DB_PASSWORD:?run scripts/demo/wallet-devnet.sh first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CRYPTOBOT_DB_USER:-cryptobot} -d life_engine_cryptobot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cryptobot-demo]

  # (paper §20) a process that is not the agent. Own copy of R_v pinned by H_R, own
  # attestation key (moves nothing). No published port: only cryptobot-service reaches it.
  cryptobot-validator:
    build: ./validator
    container_name: ${CRYPTOBOT_DEMO_PROJECT:-cryptobot-demo}-validator
    environment:
      VALIDATOR_PORT: "8097"
      VALIDATOR_KEYPAIR_PATH: /run/secrets/validator-keypair
      VALIDATOR_TOKEN: ${VALIDATOR_TOKEN:?}
      VALIDATOR_POLICY_HASH: ${VALIDATOR_POLICY_HASH:-}
      # the demo policy enables POV_REWARD (Proof of Value payouts) — the SAME list as the service below, or H_R differs.
      VALIDATOR_POLICY_ENABLED_STRATEGIES: ${CRYPTOBOT_POLICY_ENABLED_STRATEGIES:-REBALANCE,POV_REWARD}
      VALIDATOR_ENABLED: "true"
    volumes:
      - ${VALIDATOR_KEYPAIR_HOST_PATH:?}:/run/secrets/validator-keypair:ro
    # The key files are 0600 on the host: the container runs as the host user that owns them
    # (DEMO_UID from .env.demo), not as the image's own uid. Nothing else in the image needs a uid.
    user: "${DEMO_UID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8097/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [cryptobot-demo]

  # The only container with the wallet key. Byte-level caps, devnet only, attestation required.
  cryptobot-signer:
    build: ./signer
    container_name: ${CRYPTOBOT_DEMO_PROJECT:-cryptobot-demo}-signer
    environment:
      SIGNER_PORT: "8096"
      SIGNER_KEYPAIR_PATH: /run/secrets/signer-keypair
      SIGNER_TOKEN: ${SIGNER_TOKEN:?}
      SIGNER_ALLOWED_DESTINATIONS: ${SIGNER_ALLOWED_DESTINATIONS:?}
      SIGNER_MAX_LAMPORTS: ${SIGNER_MAX_LAMPORTS:-2000000000}
      SIGNER_CLUSTER: devnet
      SIGNER_VALIDATOR_PUBLIC_KEY: ${SIGNER_VALIDATOR_PUBLIC_KEY:?}
      SIGNER_REQUIRE_ATTESTATION: "true"
      SIGNER_ALLOW_MAINNET: "false"
      SIGNER_ENABLED: "true"
    volumes:
      - ${SIGNER_KEYPAIR_HOST_PATH:?}:/run/secrets/signer-keypair:ro
    user: "${DEMO_UID:-1000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8096/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks: [cryptobot-demo]

  cryptobot-service:
    # el contexto no tiene .git, así que la identidad del build entra por build-args
    # (run.sh los exporta desde git); sin ellos /actuator/info queda con git.commit vacío.
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_COMMIT_SHORT: ${GIT_COMMIT_SHORT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-}
    container_name: ${CRYPTOBOT_DEMO_PROJECT:-cryptobot-demo}-service
    depends_on:
      demo-postgres:
        condition: service_healthy
      cryptobot-validator:
        condition: service_healthy
      cryptobot-signer:
        condition: service_healthy
    environment:
      CRYPTOBOT_SERVICE_PORT: "8091"
      SPRING_PROFILES_ACTIVE: local
      APP_ENV: demo
      JWT_SECRET: ${JWT_SECRET:?}
      CRYPTOBOT_JDBC_URL: jdbc:postgresql://demo-postgres:5432/life_engine_cryptobot
      CRYPTOBOT_R2DBC_URL: r2dbc:postgresql://demo-postgres:5432/life_engine_cryptobot
      CRYPTOBOT_DB_USER: ${CRYPTOBOT_DB_USER:-cryptobot}
      CRYPTOBOT_DB_PASSWORD: ${CRYPTOBOT_DB_PASSWORD:?}
      # Solana: devnet by default; the local-validator profile overrides the URL (same cluster label).
      CRYPTOBOT_SOLANA_DEVNET_RPC: ${CRYPTOBOT_SOLANA_DEVNET_RPC:-https://api.devnet.solana.com}
      CRYPTOBOT_SNAPSHOT_PROVIDER: deterministic-local
      # ---- the execution path, for real ----
      CRYPTOBOT_EXECUTION_ENABLED: "true"
      CRYPTOBOT_ALLOW_MAINNET: "false"
      CRYPTOBOT_REBALANCE_VAULT: ${CRYPTOBOT_REBALANCE_VAULT:?}
      CRYPTOBOT_SIGNER_ENABLED: "true"
      CRYPTOBOT_SIGNER_BASE_URL: http://cryptobot-signer:8096
      CRYPTOBOT_SIGNER_TOKEN: ${CRYPTOBOT_SIGNER_TOKEN:?}
      CRYPTOBOT_VALIDATOR_ENABLED: "true"
      CRYPTOBOT_VALIDATOR_BASE_URL: http://cryptobot-validator:8097
      CRYPTOBOT_VALIDATOR_TOKEN: ${CRYPTOBOT_VALIDATOR_TOKEN:?}
      # Proof of Value V5, immediate reward: POST /value-events/{id}/distribute pays an ANCHORED event's pool in devnet
      # SOL to the contributors' wallets (only those in SIGNER_ALLOWED_DESTINATIONS). Same strategies as the validator above.
      CRYPTOBOT_POLICY_ENABLED_STRATEGIES: ${CRYPTOBOT_POLICY_ENABLED_STRATEGIES:-REBALANCE,POV_REWARD}
      POV_REWARD_ENABLED: ${POV_REWARD_ENABLED:-true}
      POV_REWARD_POOL_LAMPORTS: ${POV_REWARD_POOL_LAMPORTS:-10000000}
      # "perfil video": the waits of the demo, all overridable from .env.demo or the shell with
      # the SAME names (run.sh / e2e-devnet.sh read them too, to know how long to wait). Defaults = the
      # rehearsed values. For the recording (measured 2026-09-29, see scripts/demo/README.md):
      #   CRYPTOBOT_TIMELOCK_ESCALATED=10s  CRYPTOBOT_POLICY_COOLDOWN=15s
      #   CRYPTOBOT_RECONCILIATION_INTERVAL=5s  CRYPTOBOT_RECONCILIATION_GRACE=10s
      # (max attempts stays 3: "three reconciliation attempts, no verdict" is what the voice-over says.)
      # COOLDOWN is not part of the pinned policy hash (H_R), so shortening it needs no VALIDATOR_POLICY_HASH re-pin.
      # Demo-only: a short timelock so an ESCALATE verdict is visible (409 + wait) without 30 minutes.
      CRYPTOBOT_TIMELOCK_ESCALATED: ${CRYPTOBOT_TIMELOCK_ESCALATED:-20s}
      # Per-wallet cooldown after an execution (rule COOLDOWN; application.yml default 60s).
      CRYPTOBOT_POLICY_COOLDOWN: ${CRYPTOBOT_POLICY_COOLDOWN:-60s}
      # Reconciliation runs for real (startup + periodic); demo knobs so recovery is visible in minutes, not hours:
      # sweep every 10 s, a 20 s grace, 3 attempts without a verdict ⇒ dead letter, 2 idempotent retries.
      CRYPTOBOT_RECONCILIATION_ENABLED: "true"
      CRYPTOBOT_RECONCILIATION_INTERVAL: ${CRYPTOBOT_RECONCILIATION_INTERVAL:-10s}
      CRYPTOBOT_RECONCILIATION_GRACE: ${CRYPTOBOT_RECONCILIATION_GRACE:-20s}
      CRYPTOBOT_RECONCILIATION_MAX_ATTEMPTS: ${CRYPTOBOT_RECONCILIATION_MAX_ATTEMPTS:-3}
      CRYPTOBOT_RECONCILIATION_MAX_RETRIES: ${CRYPTOBOT_RECONCILIATION_MAX_RETRIES:-2}
      CRYPTOBOT_OUTBOX_ENABLED: "true"
      # fault injection, DEMO ONLY (never set in UAT/PROD): PUT /api/cryptobot/demo/chaos {"broadcast":"rpc-down"}.
      # The service logs `chaos_enabled — DEMO ONLY` at startup. Nothing is armed until the script (or you) arms it.
      CRYPTOBOT_CHAOS_ENABLED: "true"
      CRYPTOBOT_CHAOS_BROADCAST: ${CRYPTOBOT_CHAOS_BROADCAST:-}
      # the adversarial price of act 2, DEMO ONLY: PUT /api/cryptobot/demo/price {"asset":"SOL","source":"pyth-hermes","factor":0.1}.
      # Armed at startup only if you set it (e.g. SOL:pyth-hermes:factor=0.1); run.sh arms and disarms it itself.
      CRYPTOBOT_DEMO_PRICE_OVERRIDE: ${CRYPTOBOT_DEMO_PRICE_OVERRIDE:-}
      # Decision receipts signed with a stable key across restarts (generated into .env.demo).
      CRYPTOBOT_RECEIPT_KEY_ID: ${CRYPTOBOT_RECEIPT_KEY_ID:-demo}
      CRYPTOBOT_RECEIPT_SIGNING_KEY: ${CRYPTOBOT_RECEIPT_SIGNING_KEY:-}
      CRYPTOBOT_RECEIPT_SALT_SECRET: ${CRYPTOBOT_RECEIPT_SALT_SECRET:-}
      # Optional LLM advisor (runtime PR #33). Not on the E2E path.
      CRYPTOBOT_RUNTIME_BASE_URL: ${CRYPTOBOT_RUNTIME_BASE_URL:-http://host.docker.internal:8090}
      CRYPTOBOT_ADVISOR_LOCALE: ${CRYPTOBOT_ADVISOR_LOCALE:-es}
      CRYPTOBOT_HTTP_CORS_ALLOWED_ORIGINS: http://localhost:${UI_PORT:-4204},http://127.0.0.1:${UI_PORT:-4204}
    ports:
      - "127.0.0.1:${CRYPTOBOT_DEMO_PORT:-8091}:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [cryptobot-demo]

  # the operator UI (repo cryptobot-ui, sibling of this one under active/cryptobot/): the same
  # Angular build its Dockerfile makes (node → nginx), with config.js generated at start pointing the
  # BROWSER at the service's published port. Profile `ui`, not always-on, so run.sh and a checkout without
  # the UI repo behave exactly as before. Start everything with:
  #   CRYPTOBOT_DEMO_PROJECT=cryptobot-demo-main docker compose -f docker-compose.demo.yml --env-file .env.demo --profile ui up -d --build
  # Open http://127.0.0.1:4204/live?token=<jwt> — scripts/demo/ui-url.sh prints that URL with a 1 h demo token.
  # Published on 127.0.0.1:${UI_PORT:-4204}: the service's CORS above admits exactly that origin.
  # CRYPTOBOT_UI_CONTEXT: path to the cryptobot-ui checkout (default ../cryptobot-ui, i.e. the sibling repo
  # when this file is in active/cryptobot/cryptobot-service; from a worktree elsewhere, set it absolute).
  cryptobot-ui:
    build:
      context: ${CRYPTOBOT_UI_CONTEXT:-../cryptobot-ui}
    container_name: ${CRYPTOBOT_DEMO_PROJECT:-cryptobot-demo}-ui
    profiles: [ui]
    depends_on:
      cryptobot-service:
        condition: service_started
    environment:
      # The browser calls the API, not nginx: these are the URLs as seen from the host.
      UI_CRYPTOBOT_BASE: http://127.0.0.1:${CRYPTOBOT_DEMO_PORT:-8091}
      # No Auth in the demo stack (the token is minted with the demo JWT_SECRET, see ui-url.sh).
      UI_AUTH_BASE: ${UI_AUTH_BASE:-http://localhost:8081}
      # devnet (explorer links resolve) or local (solana-test-validator, --profile local-validator).
      UI_DEMO_CLUSTER: ${UI_DEMO_CLUSTER:-devnet}
      # the wallet /demo uses without asking: the demo wallet the scripts already use (.env.demo).
      UI_DEMO_WALLET: ${DEMO_WALLET_ADDRESS}
    ports:
      - "127.0.0.1:${UI_PORT:-4204}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/config.js >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cryptobot-demo]

  # Plan B: a local Solana validator with unlimited airdrop. Start with
  #   docker compose -f docker-compose.demo.yml --env-file .env.demo --profile local-validator up -d
  # and CRYPTOBOT_SOLANA_DEVNET_RPC=http://solana-local:8899 in .env.demo (the scripts use the
  # published port 127.0.0.1:${SOLANA_LOCAL_PORT:-8999} from the host).
  solana-local:
    image: anzaxyz/agave:v2.2.14
    container_name: ${CRYPTOBOT_DEMO_PROJECT:-cryptobot-demo}-solana
    profiles: [local-validator]
    entrypoint: ["solana-test-validator", "--rpc-port", "8899", "--bind-address", "0.0.0.0", "--ledger", "/tmp/ledger", "--reset", "--quiet"]
    ports:
      - "127.0.0.1:${SOLANA_LOCAL_PORT:-8999}:8899"
    healthcheck:
      test: ["CMD-SHELL", "solana cluster-version --url http://127.0.0.1:8899 >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [cryptobot-demo]

networks:
  cryptobot-demo: {}
